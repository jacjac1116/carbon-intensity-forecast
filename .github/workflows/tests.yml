name: tests

on: push

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                python-version: "3.11.18"
            - run: pip install --require-hashes -r requirements.lock
            - run: pip install --no-deps -e .
            - run: pip install pytest==9.0.3
            - run: pip check
            - run: pytest tests